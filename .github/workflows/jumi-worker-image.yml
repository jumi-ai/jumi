name: Build Jumi Worker Image

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: do not cancel an in-flight image publish.
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'jumi-ai/jumi'
    # GitHub-hosted runner with Docker Buildx.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jumi-ai/jumi-worker
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

      - name: Compute version
        run: |
          VERSION="$(bun src/release.ts next-version)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        working-directory: scripts/opencode

      - name: Log in to GHCR
        if: ${{ env.VERSION != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ env.VERSION != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and export to Docker
        if: ${{ env.VERSION != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: worker
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: jumi-worker:test
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            TEMURIN_TAG=${{ env.TEMURIN_TAG }}
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jumi-ai/jumi
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify worker image
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          TEST_TAG="jumi-worker:test"

          actual_user="$(docker inspect --format '{{.Config.User}}' "${TEST_TAG}")"
          if [ "${actual_user}" != "10001:10001" ]; then
            echo "Expected image user 10001:10001, got ${actual_user:-<empty>}" >&2
            exit 1
          fi
          echo "Verified image user: ${actual_user}"

          java_home="$(docker run --rm "${TEST_TAG}" printenv JAVA_HOME)"
          if [ "${java_home}" != "/opt/java/openjdk" ]; then
            echo "Expected JAVA_HOME=/opt/java/openjdk, got ${java_home:-<empty>}" >&2
            exit 1
          fi
          echo "Verified JAVA_HOME: ${java_home}"

          java_version="$(docker run --rm "${TEST_TAG}" java -version 2>&1)"
          printf '%s\n' "${java_version}"
          if ! printf '%s\n' "${java_version}" | grep -E 'version "21(\.|$)' >/dev/null; then
            echo "worker image java is not JDK 21" >&2
            exit 1
          fi
          if ! printf '%s\n' "${java_version}" | grep -F Temurin >/dev/null; then
            echo "worker image java is not Temurin" >&2
            exit 1
          fi
          echo "Verified worker JDK is Temurin 21"

          config="$(docker run --rm "${TEST_TAG}" printenv OPENCODE_CONFIG)"
          if [ "${config}" != "/app/.gitea/opencode-implement.json" ]; then
            echo "Expected OPENCODE_CONFIG=/app/.gitea/opencode-implement.json, got ${config:-<empty>}" >&2
            exit 1
          fi
          instance="$(docker run --rm "${TEST_TAG}" printenv AGENT_INSTANCE)"
          if [ "${instance}" != "jumi-worker" ]; then
            echo "Expected AGENT_INSTANCE=jumi-worker, got ${instance:-<empty>}" >&2
            exit 1
          fi
          echo "Verified worker env: ${config} ${instance}"

          docker run --rm "${TEST_TAG}" claude --version
          docker run --rm "${TEST_TAG}" codex --version
          # `--version` proves the binary exists, not that it accepts the argv
          # the codex runner spawns. These no-auth help probes fail the image
          # job when a CODEX_VERSION bump renames a flag the fresh spawn or
          # the resume extra turn depends on, instead of failing every Codex
          # run in production. Help output can only prove flag presence;
          # pre/post-resume ordering is pinned by unit tests in test/codex.test.ts.
          codex_exec_help="$(docker run --rm "${TEST_TAG}" codex exec --help)"
          for flag in --json --color --sandbox --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_exec_help" | grep -F -- "$flag" >/dev/null
          done
          codex_resume_help="$(docker run --rm "${TEST_TAG}" codex exec resume --help)"
          for flag in --json --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_resume_help" | grep -F -- "$flag" >/dev/null
          done

          # The version only proves the binary is there. Run the production
          # argv against a loopback stub endpoint (nothing billed) so a flag
          # this release rejects, or silently drops, fails here instead of on
          # every Claude spawn.
          docker run --rm "${TEST_TAG}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/claude_flag_probe.ts'

          # The child gets an xAI credential with no refresh token, so a killed
          # job cannot rotate the grant. Prove the installed binary sends that
          # shape as a bearer instead of refreshing it.
          docker run --rm "${TEST_TAG}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/xai_child_auth_probe.ts'

          docker run --rm "${TEST_TAG}" agy --version
          # `--version` only proves the binary is there. The worker is the
          # image that holds the write-capable forge token, so the installed
          # agy must refuse a fetch of that host.
          docker run --rm "${TEST_TAG}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/agy_webfetch_probe.ts'
          docker run --rm "${TEST_TAG}" test -f /app/review-skills/gitea-pull-review/SKILL.md
          echo "Verified gitea-pull-review skill"

          config_json="$(docker run --rm -e OPENCODE_DISABLE_PROJECT_CONFIG=1 -e OPENCODE_DISABLE_DEFAULT_PLUGINS=1 "${TEST_TAG}" sh -c 'cd /work && git init -q && timeout 120 opencode debug config')"
          if ! printf '%s\n' "${config_json}" | grep -F '/app/review-skills' >/dev/null; then
            printf '%s\n' "${config_json}" >&2
            echo "worker opencode debug config did not load skills.paths /app/review-skills" >&2
            exit 1
          fi
          echo "Verified opencode debug config"

          source_label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "${TEST_TAG}")"
          if [ "${source_label}" != "https://github.com/jumi-ai/jumi" ]; then
            echo "Expected org.opencontainers.image.source=https://github.com/jumi-ai/jumi, got ${source_label:-<empty>}" >&2
            exit 1
          fi
          version_label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "${TEST_TAG}")"
          if [ "${version_label}" != "${VERSION}" ]; then
            echo "Expected org.opencontainers.image.version=${VERSION}, got ${version_label:-<empty>}" >&2
            exit 1
          fi
          revision_label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${TEST_TAG}")"
          if [ "${revision_label}" != "${GITHUB_SHA}" ]; then
            echo "Expected org.opencontainers.image.revision=${GITHUB_SHA}, got ${revision_label:-<empty>}" >&2
            exit 1
          fi
          echo "Verified OCI labels"

      - name: Build and push worker image
        if: ${{ env.VERSION != '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            TEMURIN_TAG=${{ env.TEMURIN_TAG }}
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jumi-ai/jumi
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record registry manifest digest
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          echo "Pushed ${IMAGE}:${VERSION} digest=${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # Source of truth for the GitOps pin is the registry manifest Docker-Content-Digest after push.

      - name: Verify anonymous pull
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          docker rmi "${IMAGE}:${VERSION}" "${IMAGE}:latest" || true
          docker logout "${REGISTRY}"
          docker pull "${IMAGE}:${VERSION}"
          docker pull "${IMAGE}:latest"
          echo "Verified anonymous docker pull of ${IMAGE}:${VERSION} with no auth"
