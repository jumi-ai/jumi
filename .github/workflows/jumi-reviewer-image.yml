name: Publish Jumi Reviewer Image

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: never cancel a push that already started (half-pushed immutable tag).
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'kirmanak/jumi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kirmanak/jumi-reviewer
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

      - name: Compute version
        run: |
          VERSION="$(bun src/release.ts next-version)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        working-directory: scripts/opencode

      - name: Set up Docker Buildx
        if: ${{ env.VERSION != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: ${{ env.VERSION != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reviewer image
        if: ${{ env.VERSION != '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/kirmanak/jumi-reviewer:latest
            ghcr.io/kirmanak/jumi-reviewer:${{ env.VERSION }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kirmanak/jumi
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Pull pushed image for verification
        if: ${{ env.VERSION != '' }}
        run: docker pull "${IMAGE}:${VERSION}"

      - name: Verify image user and OCI labels
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          actual_user="$(docker inspect --format '{{.Config.User}}' "${IMAGE}:${VERSION}")"
          if [ "${actual_user}" != "10001:10001" ]; then
            echo "Expected image user 10001:10001, got ${actual_user:-<empty>}" >&2
            exit 1
          fi
          echo "Verified image user: ${actual_user}"
          source_label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "${IMAGE}:${VERSION}")"
          if [ "${source_label}" != "https://github.com/kirmanak/jumi" ]; then
            echo "Expected source https://github.com/kirmanak/jumi, got ${source_label:-<empty>}" >&2
            exit 1
          fi
          revision_label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE}:${VERSION}")"
          if [ "${revision_label}" != "${GITHUB_SHA}" ]; then
            echo "Expected revision ${GITHUB_SHA}, got ${revision_label:-<empty>}" >&2
            exit 1
          fi
          echo "Verified OCI source and revision labels"

      - name: Verify reviewer runtime
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          if docker run --rm "${IMAGE}:${VERSION}" sh -c 'command -v java >/dev/null 2>&1'; then
            echo "reviewer image must not ship a JVM" >&2
            exit 1
          fi
          docker run --rm "${IMAGE}:${VERSION}" python3 --version
          docker run --rm "${IMAGE}:${VERSION}" helm version --short
          docker run --rm "${IMAGE}:${VERSION}" claude --version
          docker run --rm "${IMAGE}:${VERSION}" agy --version
          docker run --rm "${IMAGE}:${VERSION}" codex --version
          # `--version` proves the binary exists, not that it accepts the argv
          # the codex runner spawns. These no-auth help probes fail the image
          # job when a CODEX_VERSION bump renames a flag the fresh spawn or
          # the resume extra turn depends on, instead of failing every Codex
          # run in production. Help output can only prove flag presence;
          # pre/post-resume ordering is pinned by unit tests in test/codex.test.ts.
          codex_exec_help="$(docker run --rm "${IMAGE}:${VERSION}" codex exec --help)"
          for flag in --json --color --sandbox --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_exec_help" | grep -F -- "$flag" >/dev/null
          done
          codex_resume_help="$(docker run --rm "${IMAGE}:${VERSION}" codex exec resume --help)"
          for flag in --json --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_resume_help" | grep -F -- "$flag" >/dev/null
          done
          docker run --rm "${IMAGE}:${VERSION}" test -f /app/review-skills/gitops-apply-review/SKILL.md
          config_json="$(docker run --rm --env OPENCODE_DISABLE_PROJECT_CONFIG=1 --env OPENCODE_DISABLE_DEFAULT_PLUGINS=1 "${IMAGE}:${VERSION}" sh -c 'cd /work && git init -q && opencode debug config')"
          printf '%s\n' "${config_json}" | grep -F '/app/review-skills' >/dev/null
          echo "Verified python3, helm, gitops-apply-review skill, and opencode debug config"

      - name: Verify reviewer webfetch denies against the opencode binary
        if: ${{ env.VERSION != '' }}
        # Drives the installed opencode binary over a loopback provider so the
        # forge-host deny is resolved by OpenCode's own matcher, not a copy.
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/webfetch_probe.ts'

      - name: Verify agy forge read_url deny against the installed binary
        if: ${{ env.VERSION != '' }}
        # Same probe as the pull_request image job: the installed agy binary
        # must refuse a fetch of the forge host under the production deny.
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/agy_webfetch_probe.ts'

      - name: Verify claude production flags against the installed binary
        if: ${{ env.VERSION != '' }}
        # Runs the argv `claudeArgv()` emits against a loopback stub endpoint,
        # so a flag this Claude release rejects or silently ignores fails the
        # image job instead of every Claude spawn in production.
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/claude_flag_probe.ts'

      - name: Verify the xAI child credential against the opencode binary
        if: ${{ env.VERSION != '' }}
        # The child gets an xAI credential with no refresh token, so a killed
        # review cannot rotate the grant. Only the real binary can say whether
        # it sends that shape as a bearer instead of refreshing it.
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/xai_child_auth_probe.ts'

      - name: Record registry manifest digest
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          echo "Pushed ${IMAGE}:${VERSION} digest=${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # Source of truth for the GitOps pin is the registry manifest Docker-Content-Digest after push.

      - name: Verify anonymous pull
        if: ${{ env.VERSION != '' }}
        run: |
          set -euo pipefail
          docker rmi "${IMAGE}:${VERSION}" "${IMAGE}:latest" || true
          docker logout "${REGISTRY}"
          docker pull "${IMAGE}:${VERSION}"
          docker pull "${IMAGE}:latest"
          echo "Verified anonymous docker pull of ${IMAGE}:${VERSION} with no auth"
