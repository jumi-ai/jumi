name: OpenCode Checks

on:
  # Default pull_request types are opened, synchronize, reopened.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

  postgres-queue:
    runs-on: ubuntu-latest

    # The queue/lease invariants are Postgres semantics (partial unique indexes,
    # FOR UPDATE SKIP LOCKED, ON CONFLICT ... WHERE, a migration that requeues before it
    # indexes). They only mean something against a real server, so this job is the one
    # that owns a database; `checks` stays Postgres-free and skips the suite.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jumi
          POSTGRES_PASSWORD: jumi
          POSTGRES_DB: jumi_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jumi -d jumi_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run the queue/lease suite against Postgres
        run: bun run test:pg
        working-directory: scripts/opencode
        env:
          JUMI_TEST_DATABASE_URL: postgres://jumi:jumi@127.0.0.1:5432/jumi_queue_test
          # Fails the suite instead of skipping it if the URL above ever goes missing.
          JUMI_TEST_PG_REQUIRED: "1"

  image-build:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build reviewer image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          tags: jumi-reviewer:ci
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}

      - name: Verify reviewer image
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' jumi-reviewer:ci)" = "10001:10001"
          if docker run --rm jumi-reviewer:ci sh -c 'command -v java >/dev/null 2>&1'; then
            echo "reviewer image must not ship a JVM" >&2
            exit 1
          fi
          docker run --rm jumi-reviewer:ci python3 --version
          docker run --rm jumi-reviewer:ci helm version --short
          docker run --rm jumi-reviewer:ci claude --version
          docker run --rm jumi-reviewer:ci agy --version
          docker run --rm jumi-reviewer:ci codex --version
          # `--version` proves the binary exists, not that it accepts the argv
          # the codex runner spawns. These no-auth help probes fail the image
          # job when a CODEX_VERSION bump renames a flag the fresh spawn or
          # the resume extra turn depends on, instead of failing every Codex
          # run in production. Help output can only prove flag presence;
          # pre/post-resume ordering is pinned by unit tests in test/codex.test.ts.
          codex_exec_help="$(docker run --rm jumi-reviewer:ci codex exec --help)"
          for flag in --json --color --sandbox --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_exec_help" | grep -E -- "$flag([ ,=]|$)" >/dev/null
          done
          codex_resume_help="$(docker run --rm jumi-reviewer:ci codex exec resume --help)"
          for flag in --json --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_resume_help" | grep -E -- "$flag([ ,=]|$)" >/dev/null
          done
          docker run --rm jumi-reviewer:ci test -f /app/review-skills/gitops-apply-review/SKILL.md
          # Claude tracing is vendored, never installed at run time, and its
          # hooks are pure shell over jq + python3 — both must be in the image.
          docker run --rm jumi-reviewer:ci test -f /app/claude-plugins/claude-code-tracing/hooks/common.sh
          docker run --rm jumi-reviewer:ci sh -c 'command -v jq >/dev/null && command -v python3 >/dev/null && command -v bash >/dev/null'
          # The parent passes the plugin with --plugin-dir. A CLAUDE_VERSION bump
          # that drops the flag must fail here, not silently stop tracing.
          docker run --rm jumi-reviewer:ci claude --help | grep -F -- '--plugin-dir' >/dev/null
          # Plugin root may also carry bin/, agents/, skills/, .mcp.json,
          # monitors/ and settings.json — any of those reach the untrusted-checkout
          # child. A re-sync that adds one must fail the build, not ship.
          plugin_top="$(docker run --rm jumi-reviewer:ci sh -c 'ls -1A /app/claude-plugins/claude-code-tracing' | sort)"
          plugin_want="$(printf '%s\n' '.claude-plugin' 'LICENSE' 'UPSTREAM.md' 'hooks' | sort)"
          if [ "$plugin_top" != "$plugin_want" ]; then
            echo "tracing plugin top level must be only .claude-plugin, hooks, LICENSE, UPSTREAM.md; got:" >&2
            printf '%s\n' "$plugin_top" >&2
            exit 1
          fi
          config_json="$(docker run --rm --env OPENCODE_DISABLE_PROJECT_CONFIG=1 --env OPENCODE_DISABLE_DEFAULT_PLUGINS=1 jumi-reviewer:ci sh -c 'cd /work && git init -q && timeout 120 opencode debug config')"
          printf '%s\n' "$config_json" | grep -F '/app/review-skills' >/dev/null

      - name: Verify reviewer webfetch denies against the opencode binary
        # This is the path that gates a pull request, so it is the one that
        # catches an OPENCODE_VERSION bump whose matcher drops the forge-host
        # deny — before the image is built for publication, not after.
        # The outer cap sits above the probe's own per-run budget so a hang
        # still reports a row-level FAIL rather than being killed from outside.
        run: |
          set -euo pipefail
          docker run --rm jumi-reviewer:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/webfetch_probe.ts'

      - name: Verify agy forge read_url deny against the installed binary
        # `agy --version` proves the binary exists, not that a child is refused
        # a fetch of the forge host it was given credentials for. The probe
        # installs the production deny and drives the real binary at a loopback
        # Gemini endpoint, so an AGY bump that stops honoring permissions.deny
        # fails here.
        run: |
          set -euo pipefail
          docker run --rm jumi-reviewer:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/agy_webfetch_probe.ts'

      - name: Verify claude production flags against the installed binary
        # `claude --version` proves the binary exists, not that it accepts the
        # argv Jumi spawns: a rejected flag is a generic non-zero exit on every
        # Claude run. The probe runs the real argv against a loopback stub
        # endpoint (nothing billed, no token in the child env) and re-runs each
        # pinned value as nonsense so the pass cannot be vacuous. It also gives
        # that run a throwaway loopback Phoenix and requires a span to arrive,
        # which is the only check anywhere that the plugin `--plugin-dir` names
        # is actually loaded and run — `--help` only proves the flag exists.
        run: |
          set -euo pipefail
          docker run --rm jumi-reviewer:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/claude_flag_probe.ts'

      - name: Verify the xAI child credential against the opencode binary
        # Jumi hands the child an xAI credential with no refresh token so a
        # killed review cannot rotate the grant and take the new token with it.
        # Only the real binary can say whether it sends that shape as a bearer
        # instead of refreshing it, so an OPENCODE_VERSION bump that changes the
        # provider loader fails here rather than in production.
        run: |
          set -euo pipefail
          docker run --rm jumi-reviewer:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/xai_child_auth_probe.ts'

  worker-image-build:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build worker image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: worker
          load: true
          tags: jumi-worker:ci
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            TEMURIN_TAG=${{ env.TEMURIN_TAG }}

      - name: Verify worker image
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' jumi-worker:ci)" = "10001:10001"
          test "$(docker run --rm jumi-worker:ci printenv JAVA_HOME)" = "/opt/java/openjdk"
          java_version="$(docker run --rm jumi-worker:ci java -version 2>&1)"
          printf '%s\n' "$java_version" | grep -E 'version "21(\.|$)'
          printf '%s\n' "$java_version" | grep -F Temurin
          docker run --rm jumi-worker:ci claude --version
          docker run --rm jumi-worker:ci agy --version
          docker run --rm jumi-worker:ci codex --version
          # Same no-auth help probe as the reviewer job: the worker image also
          # spawns Codex runners, so its binary has to accept the same argv.
          codex_exec_help="$(docker run --rm jumi-worker:ci codex exec --help)"
          for flag in --json --color --sandbox --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_exec_help" | grep -E -- "$flag([ ,=]|$)" >/dev/null
          done
          codex_resume_help="$(docker run --rm jumi-worker:ci codex exec resume --help)"
          for flag in --json --skip-git-repo-check --ignore-rules --ignore-user-config --model --config; do
            printf '%s\n' "$codex_resume_help" | grep -E -- "$flag([ ,=]|$)" >/dev/null
          done
          docker run --rm jumi-worker:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/agy_webfetch_probe.ts'
          docker run --rm jumi-worker:ci test -f /app/review-skills/gitea-pull-review/SKILL.md
          docker run --rm jumi-worker:ci test -f /app/claude-plugins/claude-code-tracing/hooks/common.sh
          config_json="$(docker run --rm --env OPENCODE_DISABLE_PROJECT_CONFIG=1 --env OPENCODE_DISABLE_DEFAULT_PLUGINS=1 jumi-worker:ci sh -c 'cd /work && git init -q && timeout 120 opencode debug config')"
          printf '%s\n' "$config_json" | grep -F '/app/review-skills' >/dev/null

      - name: Verify claude production flags against the installed binary
        # The worker is the image that actually spawns Claude runners, so the
        # argv it ships has to parse here too, and its `AGENT_INSTANCE` puts the
        # probe's span under `jumi-worker`. Same probe as the reviewer job.
        run: |
          set -euo pipefail
          docker run --rm jumi-worker:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/claude_flag_probe.ts'

      - name: Verify the xAI child credential against the opencode binary
        # The worker holds the same grant and runs the 4h jobs. Same probe.
        run: |
          set -euo pipefail
          docker run --rm jumi-worker:ci \
            sh -c 'cd /app/scripts/opencode && timeout 600 bun src/xai_child_auth_probe.ts'
